name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install -e "./petras-core[dev]"
          pytest petras-core/tests -q

      # The manuscript claims the shapes validate and the competency questions
      # answer. These two steps keep that claim true rather than asserted.
      - name: SHACL shapes validate the demo project
        run: petras validate demos/cathedral-shell

      - name: Every competency question is answered
        run: petras ask --all --project demos/cathedral-shell --limit 3

      # The benchmark is the project the paper's tables report on, and it is
      # the one that regressed: a whole seismic sequence sat unlinked and CQ8
      # returned no rows while the cathedral demo kept passing.
      - name: Every competency question is answered on the benchmark
        run: petras ask --all --project demos/benchmark-shell --limit 3
      - name: No c2f4dt in ontology/demos
        run: |
          if rg -n 'c2f4dt' ontology demos --glob '!**/.*'; then
            echo "Found forbidden c2f4dt string" >&2
            exit 1
          fi
      - name: Regenerate demo graph
        run: |
          python scripts/generate_demo_project.py --out demos/cathedral-shell
          python -m petras export-graph demos/cathedral-shell \
            -o viewer/public/demos/cathedral-shell/graph.json
          python -m petras export-cq demos/cathedral-shell \
            -o viewer/public/demos/cathedral-shell/cq-answers.json

  viewer:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build viewer
        working-directory: viewer
        run: |
          npm ci || npm install
          npm run build
